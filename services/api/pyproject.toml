[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "super-agent-api"
version = "0.1.0"
description = "API and worker services for Super Agent."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "qdrant-client>=1.7.0",
  "celery>=5.3.0",
  "minio>=7.2.0",
  "opa-client>=1.0.0",
  "pydantic>=2.6.0",
  "redis>=5.0.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "mcp>=1.0.0",
  "openai-agents>=0.0.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["**/*.py"]
